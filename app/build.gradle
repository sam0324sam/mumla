buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}
apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

def signingFile = file 'signing.gradle'
if (signingFile.exists()) apply from: signingFile
def signingBetaFile = file 'signing-beta.gradle'
if (signingBetaFile.exists()) apply from: signingBetaFile

allprojects {
    tasks.withType(JavaCompile) {
        // TODO include deprecations at some point, but currently they are *many*
        options.compilerArgs << "-Xlint:all" << "-Xlint:-deprecation" << "-Xlint:-dep-ann"
    }
}

android {
    namespace = 'se.lublin.mumla'
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    base {
        archivesName = "mumla"
    }

    // gradle8: Need to enable this when defaultConfig below contains some custom BuildConfig
    buildFeatures {
        buildConfig = true
    }

    def gitDescribe = providers.exec {
        // Need --always because there are no tags in gitlab ci (right?)
        commandLine "git", "describe", "--tags", "--match", "[0-9]*.[0-9]*.[0-9]*", "--always"
    }.standardOutput.asText.get().trim()

    def gitSha = providers.exec {
        commandLine "git", "rev-parse", "--short=7", "HEAD"
    }.standardOutput.asText.get().trim()

    def gitCommitCount = providers.exec {
        commandLine "git", "rev-list", "--count", "HEAD"
    }.standardOutput.asText.get().trim().toInteger()

    def baseVersionTag = gitDescribe.split("-")[0]

    defaultConfig {
        minSdkVersion 21
        targetSdk 36

        applicationId "se.lublin.mumla"
        // Auto-incrementing versionCode per git commit for seamless OTA upgrades
        versionCode 3070300 + gitCommitCount
        versionName "${baseVersionTag}-poc.${gitCommitCount}-${gitSha}"

        // Target real ARM walkie-talkies (armeabi-v7a) and modern ARM64 phones; strip ~4MB x86/x86_64 emulator libs
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        // Trim 30+ unused locales from resources.arsc (keep Traditional Chinese & English only)
        resourceConfigurations += ['zh-rTW', 'en']

        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        buildConfigField "String", "VERSIONTAG", "\"" + gitDescribe.split("-")[0] + "\""
        buildConfigField "String", "GIT_SHA", "\"" + gitSha + "\""

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    flavorDimensions "release"
    productFlavors {
        foss {
            dimension "release"
            applicationId "se.lublin.mumla"
        }
    }

    def userDebugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
    if (userDebugKeystore.exists() && userDebugKeystore.length() > 0) {
        signingConfigs {
            debug {
                storeFile userDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (android.hasProperty("signingConfigs") && signingConfigs.hasProperty("release")) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            versionNameSuffix "-debug"
            signingConfig = signingConfigs.debug
        }
    }
    lint {
        abortOnError = true
        // InvalidPackage is spongycastle-related
        disable 'InvalidPackage', 'MissingTranslation'
        explainIssues = true
        ignoreWarnings = false
        quiet = false
    }
}

dependencies {
    implementation project(":libraries:humla")
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
}
