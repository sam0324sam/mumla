name: Build Debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "Gradle task to run (default: :app:assembleFossDebug)"
        required: false
        default: ":app:assembleFossDebug"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache debug keystore (fallback when secret is not set)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Restore debug keystore from secret (if provided)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          fi

      - name: Build humla-spongycastle jar
        run: |
          if [ -d libraries/humla/libs/humla-spongycastle ]; then
            pushd libraries/humla/libs/humla-spongycastle
            chmod +x ../../gradlew
            ../../gradlew jar
            popd
          fi

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          TASK="${{ github.event.inputs.gradle_task || ':app:assembleFossDebug' }}"
          ./gradlew $TASK -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      - name: Collect APK artifacts
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumla-debug-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish rolling dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE=$(find dist -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found in dist/"
            exit 1
          fi
          cp "$APK_FILE" dist/mumla-latest-debug.apk
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          NOTES="Auto-built from \`${GITHUB_SHA::7}\`: ${COMMIT_MSG}"
          # Recreate release & move dev-latest tag so GitHub refreshes published_at and shows the Latest badge
          gh release delete dev-latest --yes || true
          git tag -f dev-latest "$GITHUB_SHA"
          git push -f origin refs/tags/dev-latest
          gh release create dev-latest dist/mumla-latest-debug.apk \
            --title "Dev Latest (${GITHUB_SHA::7})" \
            --notes "$NOTES" \
            --latest
